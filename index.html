<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>underward</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:#0b0f14; color:#d7e3ee; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; }
  #canvas { display:block; width:100%; height:100%; }

  #hud { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:10px 12px; background:rgba(10,14,18,.86); backdrop-filter:blur(4px); z-index:5; font-size:14px; font-weight:600; }
  .stat { display:flex; align-items:center; gap:6px; background:#141b23; border:1px solid #2a3440; border-radius:10px; padding:6px 10px; white-space:nowrap; }
  .ico { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .ico.hp{background:#ff5c5c;box-shadow:0 0 6px #ff5c5c}
  .ico.atk{background:#ffcf4a;box-shadow:0 0 6px #ffcf4a}
  .ico.shard{background:#7ee0ff;box-shadow:0 0 8px #7ee0ff}
  .ico.floor{background:#9b8cff;box-shadow:0 0 5px #9b8cff}
  .spacer{flex:1}

  #hint { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:13px; font-weight:600; color:#9fb3c8; z-index:5; pointer-events:none; text-shadow:0 1px 2px #000; }

  .overlay { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; text-align:center; background:rgba(8,11,15,.94); }
  .overlay h1{font-size:30px;letter-spacing:1px}
  .overlay h2{font-size:20px;color:#ff9a9a}
  .sub{color:#8fa3b8;font-size:14px;max-width:340px;line-height:1.5}

  .shop{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
  .upgrade{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#141b23;border:1px solid #2a3440;border-radius:14px;padding:14px 16px;width:100%}
  .upgrade .name{font-weight:700;font-size:16px;text-align:left}
  .upgrade .desc{font-size:12px;color:#8fa3b8;text-align:left;margin-top:3px}
  .btn{background:#1f7a5c;color:#eafff5;border:none;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer;min-width:120px;box-shadow:0 4px 0 #0e3d2e}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0e3d2e}
  .btn:disabled{background:#32424c;color:#7b8c98;box-shadow:none;cursor:default}
  .btn.big{width:100%;max-width:340px;padding:18px;font-size:18px}
  .walletbar{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;background:#141b23;border:1px solid #2a3440;border-radius:12px;padding:10px 16px}
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div id="hud" style="display:none">
    <span class="stat"><span class="ico hp"></span><span id="hudHp">30</span></span>
    <span class="stat"><span class="ico atk"></span><span id="hudAtk">5</span></span>
    <span class="stat"><span class="ico floor"></span><span id="hudFloor">1</span></span>
    <span class="spacer"></span>
    <span class="stat"><span class="ico shard"></span><span id="hudShards">0</span></span>
  </div>

  <div id="hint" style="display:none">Tap an adjacent square to move, or tap a monster to attack</div>

  <div id="hubScreen" class="overlay">
    <h1>underward</h1>
    <p class="sub">Go as deep as you can. Earn shards, die, buy upgrades, retry.</p>
    <div class="walletbar"><span class="ico shard"></span><span id="hubShards">0</span></div>
    <div class="shop">
      <div class="upgrade">
        <div><div class="name">Max HP <span id="hpLvl"></span></div><div class="desc">+5 max health per level</div></div>
        <button class="btn" id="buyHp">20</button>
      </div>
      <div class="upgrade">
        <div><div class="name">Attack <span id="atkLvl"></span></div><div class="desc">+1 damage per level</div></div>
        <button class="btn" id="buyAtk">15</button>
      </div>
    </div>
    <button class="btn big" id="startBtn">START RUN</button>
  </div>

  <div id="deathScreen" class="overlay" style="display:none">
    <h1>YOU DIED</h1>
    <h2 id="deathInfo"></h2>
    <div class="walletbar"><span class="ico shard"></span><span id="deathShards">0</span></div>
    <button class="btn big" id="deathBtn">BACK TO HUB</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/save.js"></script>
<script src="js/state.js"></script>
<script src="js/levels.js"></script>
<script src="js/combat.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
