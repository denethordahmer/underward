<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>underward</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:#0b0f14; color:#d7e3ee; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; }
  #canvas { display:block; width:100%; height:100%; }

  #hud { position:absolute; top:0; left:0; right:0; display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px 10px; background:rgba(10,14,18,.86); backdrop-filter:blur(4px); z-index:5; font-size:12px; font-weight:600; }
  .stat { display:flex; align-items:center; gap:5px; background:#141b23; border:1px solid #2a3440; border-radius:10px; padding:5px 8px; white-space:nowrap; }
  .ico { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .ico.hp{background:#ff5c5c;box-shadow:0 0 6px #ff5c5c}
  .ico.atk{background:#ffcf4a;box-shadow:0 0 6px #ffcf4a}
  .ico.tou{background:#ff8a3d;box-shadow:0 0 6px #ff8a3d}
  .ico.agi{background:#c2ff4d;box-shadow:0 0 6px #c2ff4d}
  .ico.luc{background:#9dffcf;box-shadow:0 0 6px #9dffcf}
  .ico.shard{background:#7ee0ff;box-shadow:0 0 8px #7ee0ff}
  .ico.floor{background:#9b8cff;box-shadow:0 0 5px #9b8cff}
  .spacer{flex:1}

  #hint { position:absolute; bottom:14px; left:0; right:0; text-align:center; font-size:13px; font-weight:600; color:#9fb3c8; z-index:5; pointer-events:none; text-shadow:0 1px 2px #000; }

  .overlay { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; padding:20px; text-align:center; background:rgba(8,11,15,.94); overflow-y:auto; }
  .overlay h1{font-size:30px;letter-spacing:1px;margin:0}
  .overlay h2{font-size:20px;color:#ff9a9a;margin:0}
  .sub{color:#8fa3b8;font-size:13px;max-width:340px;line-height:1.5}

  .shop{display:flex;flex-direction:column;gap:9px;width:100%;max-width:360px;max-height:52vh;overflow-y:auto}
  .upgrade{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#141b23;border:1px solid #2a3440;border-radius:13px;padding:11px 14px;width:100%;flex-shrink:0}
  .upgrade .name{font-weight:700;font-size:15px;text-align:left}
  .upgrade .desc{font-size:11.5px;color:#8fa3b8;text-align:left;margin-top:3px}
  .lvl{color:#647a8e;font-size:11px;font-weight:600}
  .btn{background:#1f7a5c;color:#eafff5;border:none;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:800;cursor:pointer;min-width:88px;box-shadow:0 4px 0 #0e3d2e;flex-shrink:0}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0e3d2e}
  .btn:disabled{background:#32424c;color:#7b8c98;box-shadow:none;cursor:default}
  .btn.big{width:100%;max-width:360px;padding:16px;font-size:17px}
  .walletbar{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;background:#141b23;border:1px solid #2a3440;border-radius:12px;padding:9px 14px}
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div id="hud" style="display:none">
    <span class="stat"><span class="ico hp"></span><span id="hudHp">30/30</span></span>
    <span class="stat"><span class="ico atk"></span><span id="hudAtk">6</span></span>
    <span class="stat"><span class="ico tou"></span><span id="hudTou">20%</span></span>
    <span class="stat"><span class="ico agi"></span><span id="hudAgi">4%</span></span>
    <span class="stat"><span class="ico luc"></span><span id="hudLuc">1</span></span>
    <span class="stat"><span class="ico floor"></span><span id="hudFloor">1</span></span>
    <span class="spacer"></span>
    <span class="stat"><span class="ico shard"></span><span id="hudShards">0</span></span>
  </div>

  <div id="hint" style="display:none">Tap an adjacent square to move, or tap a monster to attack</div>

  <div id="hubScreen" class="overlay">
    <h1>underward</h1>
    <p class="sub">Earn shards, spend them on attributes, go deeper.</p>
    <div class="walletbar"><span class="ico shard"></span><span id="hubShards">0</span></div>
    <div class="shop" id="shop"></div>
    <button class="btn big" id="startBtn">START RUN</button>
  </div>

  <div id="deathScreen" class="overlay" style="display:none">
    <h1>YOU DIED</h1>
    <h2 id="deathInfo"></h2>
    <div class="walletbar"><span class="ico shard"></span><span id="deathShards">0</span></div>
    <button class="btn big" id="deathBtn">BACK TO HUB</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/save.js"></script>
<script src="js/attrs.js"></script>
<script src="js/state.js"></script>
<script src="js/levels.js"></script>
<script src="js/combat.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
