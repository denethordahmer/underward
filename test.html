<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>underward — test</title>
<style>
  body{background:#0b0f14;color:#d7e3ee;font-family:system-ui,sans-serif;padding:20px;font-size:15px;line-height:1.5;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:#7f94a8;font-size:13px;margin-bottom:18px;}
  .section{margin:18px 0;padding:14px 16px;border:1px solid #2a3440;border-radius:12px;background:#121920;}
  .section h2{margin:0 0 10px;font-size:16px;color:#7ee0ff;}
  .pass{color:#7ee08a;font-weight:700;}
  .fail{color:#ff7a7a;font-weight:700;}
  .warn{color:#ffd75e;font-weight:700;}
  code{background:#1a2530;padding:1px 6px;border-radius:5px;font-size:13px;}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px;}
  td,th{border:1px solid #2a3440;padding:6px 9px;text-align:left;vertical-align:top;}
  th{color:#9fb3c5;font-weight:700;}
  .dup{color:#ff7a7a;}
  .missing{color:#ff9a7a;}
  #results{max-width:780px;margin:0 auto;}
</style>
</head>
<body>
<div id="results">
  <h1>underward · test</h1>
  <div class="sub">Loads every script, records ownership, then runs floor-generation checks.</div>
  <div id="console"></div>
</div>

<div style="display:none" id="fixtures">
  <canvas id="canvas" width="800" height="600"></canvas>
  <canvas id="minimap" width="170" height="170"></canvas>
  <canvas id="charCanvas" width="200" height="260"></canvas>

  <div id="hud">
    <span id="hudHp"></span><span id="hudAtk"></span><span id="hudTou"></span>
    <span id="hudAgi"></span><span id="hudLuc"></span><span id="hudFloor"></span>
    <span id="hudEnergy"></span><span id="hudGold"></span><span id="hudShards"></span>
    <div id="restDots"></div>
    <button id="minimapBtn"></button><button id="gearBtn"></button><button id="invBtn"></button>
  </div>

  <div id="abilityBar"></div>
  <div id="minimapWrap"></div>
  <div id="combatVignette"></div>

  <div id="logPanel"><button id="logExpandBtn"></button><div id="combatLog"></div></div>
  <div id="logWindow"><div id="logWindowHeader"><button id="logWindowClose"></button></div><div id="logWindowContent"></div></div>

  <div id="floorCard"><div id="floorCardInner"><span id="floorCardNum"></span><span id="floorCardName"></span></div></div>
  <div id="bossIntroOverlay"><div id="bossIntroCard"><span id="bossIntroWarning"></span><span id="bossIntroName"></span><span id="bossIntroTitle"></span><span id="bossIntroFlavour"></span></div></div>

  <div id="stairsPrompt"><div id="stairsCard"><button id="stairsYes"></button><button id="stairsNo"></button></div></div>

  <div id="itemCardOverlay"><div id="itemCard">
    <div id="icHeader"><div id="icName"></div><div id="icTier"></div></div>
    <div id="icFlavour"></div><div id="icStats"></div>
    <div id="icButtons"><button id="icPrimaryBtn"></button><button id="icSecondaryBtn"></button></div>
    <button id="icCloseBtn"></button>
  </div></div>

  <div id="inventoryScreen"><div class="inv-header"><button id="invCloseBtn2"></button></div>
    <div id="equipRack"></div><div id="invCarriedGrid"></div></div>

  <div id="levelupScreen"><div id="levelupChoices"></div></div>

  <div id="shopScreen"><span id="shopGold"></span><span id="shopGreeting"></span>
    <div id="shopStock"></div><button id="shopHealBtn"></button><button id="shopLeaveBtn"></button></div>

  <div id="hubScreen"><span id="hubShards"></span><div id="hubTabs"></div>
    <div class="shop" id="shop"></div><div id="treePanel"></div><button id="startBtn"></button></div>

  <div id="victoryScreen"><span id="victoryShards"></span><div id="victorySummary"></div>
    <button id="victoryContinue"></button><button id="victoryHub"></button></div>

  <div id="deathScreen"><div id="deathInfo"></div><div id="deathQuote"></div>
    <div id="deathSummary"></div><span id="deathShards"></span><button id="deathBtn"></button></div>

  <div id="retreatMenu"><button id="retreatYes"></button><button id="retreatNo"></button></div>

  <div id="pauseMenu"><div id="pauseCard">
    <button id="muteBtn"></button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.55">
    <button id="pauseRetreatBtn"></button>
    <button id="pauseCloseBtn"></button>
  </div></div>
</div>

<script>
function makeCtx() {
  var gradient = { addColorStop: function(){} };
  return new Proxy(function(){}, {
    get: function(t, p){
      if (p === "createLinearGradient" || p === "createRadialGradient" || p === "createPattern") return function(){ return gradient; };
      if (p === "measureText") return function(){ return { width: 0 }; };
      if (p === "canvas") return {};
      return function(){};
    },
    set: function(t, p, v){ t[p] = v; return true; }
  });
}
var canvases = document.querySelectorAll("canvas");
for (var c = 0; c < canvases.length; c++) canvases[c].getContext = function(){ return makeCtx(); };

window.requestAnimationFrame = function(){};
window.cancelAnimationFrame = function(){};

var outBox = document.getElementById("console");
function out(html){ outBox.insertAdjacentHTML("beforeend", html); }
function sec(title){
  var id = "sec" + (sec.n = (sec.n || 0) + 1);
  out('<div class="section"><h2>' + title + '</h2><div id="' + id + '"></div></div>');
  return document.getElementById(id);
}

var FILES = [
  "js/config.js","js/content/con-monsters.js","js/content/con-items.js","js/content/con-biomes.js","js/content/con-traits.js",
  "js/save.js","js/attrs.js","js/items.js","js/sprites.js","js/bosssprites.js",
  "js/state.js","js/levels.js","js/traits.js","js/combat.js",
  "js/effects.js","js/sfx.js","js/log.js","js/render.js","js/pathfind.js","js/input.js",
  "js/ui.js","js/progression.js","js/main.js","js/onboarding.js"
];

var ownership = {};
var dupes = {};
var errors = [];
var floorFailures = 0;
var bossSpriteFailures = 0;

var s1 = sec("1. Script loading &amp; ownership");
FILES.forEach(function(file){
  var before = {};
  for (var k in window.Delve) before[k] = 1;

  var loaded = false;
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", file, false);
    xhr.send();
    if (xhr.status !== 0 && xhr.status !== 200) {
      errors.push(file + " status " + xhr.status);
      s1.insertAdjacentHTML("beforeend", '<div class="fail">✗ ' + file + ' — fetch status ' + xhr.status + '</div>');
    } else {
      (new Function(xhr.responseText))();
      loaded = true;
    }
  } catch (err) {
    errors.push(file + ": " + err.message);
    s1.insertAdjacentHTML("beforeend", '<div class="fail">✗ ' + file + ' — ' + err.message + '</div>');
  }

  if (loaded) {
    var added = [];
    for (var k in window.Delve) {
      if (!before[k]) {
        added.push(k);
        if (ownership[k]) (dupes[k] = dupes[k] || []).push(file);
        else ownership[k] = file;
      }
    }
    s1.insertAdjacentHTML("beforeend", '<div class="pass">✓ ' + file + ' <span style="color:#9fb3c5">(' + added.length + ' new)</span></div>');
  }
});

if (typeof window.Delve.draw === "function") window.Delve.draw = function(){};

var s2 = sec("2. Duplicate definitions");
var dupKeys = Object.keys(dupes);
if (!dupKeys.length) s2.innerHTML = '<div class="pass">✓ No duplicates.</div>';
else {
  s2.innerHTML = '<div class="warn">Defined in more than one file:</div><table><tr><th>Function</th><th>Files</th></tr>';
  dupKeys.forEach(function(k){ s2.innerHTML += '<tr><td class="dup">' + k + '</td><td>' + [ownership[k]].concat(dupes[k]).join(", ") + '</td></tr>'; });
  s2.innerHTML += '</table>';
}

var s3 = sec("3. Required functions");
var REQUIRED = [
  "newRun","genFloor","maxHp","atk","dmgRed","dodge","crit","luckPts","agiPts","touPts",
  "equipItem","unequipItem","useConsumable","itemStatLines","itemBuffs","makeItem","rollTier",
  "killRewards","floorClearBonus","makeElite","startCombat","triggerVictory","tryRest","descend",
  "die","retreat","convertGold","recordStat","addFloater","draw","updateHUD","renderMinimap",
  "refreshHub","openInventory","openShop","buildShop","applyEffect","applyPlayerEffect",
  "registerBossSprite"
];
var missing = REQUIRED.filter(function(k){ return typeof window.Delve[k] !== "function"; });
if (!missing.length) s3.innerHTML = '<div class="pass">✓ All ' + REQUIRED.length + ' required functions present.</div>';
else s3.innerHTML = '<div class="fail">Missing:</div><div class="missing">' + missing.join(", ") + '</div>';

var s3b = sec("3b. Boss sprite registry");
try {
  var registered = window.Delve._bossSpriteBuilders || {};
  var expectedKeys = [];
  var bossDefs = (window.Delve.CONFIG && window.Delve.CONFIG.BOSS_DEFS) || {};
  for (var bk in bossDefs) {
    if (bossDefs[bk] && bossDefs[bk].sprite) expectedKeys.push(bossDefs[bk].sprite);
  }
  var missingBuilders = expectedKeys.filter(function(k){ return typeof registered[k] !== "function"; });
  var missingSprites = expectedKeys.filter(function(k){ return !(window.Delve.SPR && window.Delve.SPR[k] && window.Delve.SPR[k].idle); });
  if (!expectedKeys.length) {
    s3b.innerHTML = '<div class="warn">No BOSS_DEFS.sprite entries to verify.</div>';
  } else if (!missingBuilders.length && !missingSprites.length) {
    s3b.innerHTML = '<div class="pass">✓ ' + expectedKeys.length + ' boss sprite(s) registered and built: ' + expectedKeys.join(", ") + '</div>';
  } else {
    bossSpriteFailures = missingBuilders.length + missingSprites.length;
    s3b.innerHTML = '<div class="fail">Problems with boss sprites:</div>';
    if (missingBuilders.length) s3b.innerHTML += '<div class="missing">No builder registered: ' + missingBuilders.join(", ") + '</div>';
    if (missingSprites.length) s3b.innerHTML += '<div class="missing">No sprite built: ' + missingSprites.join(", ") + '</div>';
  }
} catch (err) {
  bossSpriteFailures = 1;
  s3b.innerHTML = '<div class="fail">Boss sprite check aborted: ' + err.message + '</div>';
}

var s4 = sec("4. Floor generation (50 trials, floors 1-20)");
try {
  if (typeof window.Delve.newRun !== "function") throw new Error("newRun missing — cannot seed a run");
  window.Delve.newRun();
  var G = window.Delve.G;
  if (!G) throw new Error("Delve.G still null after newRun");

  var trials = 50, fails = [];
  for (var t = 0; t < trials; t++) {
    G.floor = (t % 20) + 1;
    var ward = Delve.getWard(G.floor);
    if (!ward) fails.push("trial " + t + ": no ward for floor " + G.floor);
    var biomeIdx = (ward && ward.biome !== undefined) ? ward.biome : -1;
    if (biomeIdx < 0 || !Delve.CONFIG.BIOMES[biomeIdx]) {
      fails.push("trial " + t + ": biome " + biomeIdx + " missing for floor " + G.floor);
    }
    Delve.genFloor();
    var w = G.grid[0].length, h = G.grid.length;
    if (G.px < 0 || G.py < 0 || G.px >= w || G.py >= h) fails.push("trial " + t + ": player outside map");
    else if (G.grid[G.py][G.px] !== Delve.T.FLOOR) fails.push("trial " + t + ": player not on floor tile");
    if (G.floor % 10 !== 0 && !G.stairs) fails.push("trial " + t + ": no stairs on floor " + G.floor);
    G.monsters.forEach(function(m){
      if (Delve.mdist(m.x, m.y, G.px, G.py) <= 1) fails.push("trial " + t + ": monster adjacent to spawn");
    });
    if (fails.length > 25) break;
  }
  floorFailures = fails.length;
  if (!fails.length) s4.innerHTML = '<div class="pass">✓ ' + trials + ' floors generated cleanly across both biomes.</div>';
  else {
    s4.innerHTML = '<div class="fail">' + fails.length + ' problem(s):</div><ul style="margin-left:18px">';
    fails.slice(0, 25).forEach(function(f){ s4.innerHTML += "<li>" + f + "</li>"; });
    s4.innerHTML += "</ul>";
  }
} catch (err) {
  floorFailures = 1;
  s4.innerHTML = '<div class="fail">Floor checks aborted: ' + err.message + '</div>';
}

var s5 = sec("5. Summary");
if (errors.length) s5.innerHTML += '<div class="fail">Script errors: ' + errors.length + '</div>';
if (missing.length) s5.innerHTML += '<div class="fail">Missing functions: ' + missing.length + '</div>';
if (dupKeys.length) s5.innerHTML += '<div class="warn">Duplicates: ' + dupKeys.length + '</div>';
if (bossSpriteFailures) s5.innerHTML += '<div class="fail">Boss sprite issues: ' + bossSpriteFailures + '</div>';
if (floorFailures) s5.innerHTML += '<div class="fail">Floor generation issues: ' + floorFailures + '</div>';
if (!errors.length && !missing.length && !dupKeys.length && !bossSpriteFailures && !floorFailures) s5.innerHTML += '<div class="pass">✓ All checks passed.</div>';

var s6 = sec("6. Ownership registry");
var keys = Object.keys(ownership).sort();
var table = '<table><tr><th>Function</th><th>Owned by</th></tr>';
keys.forEach(function(k){ table += '<tr><td><code>' + k + '</code></td><td>' + ownership[k] + '</td></tr>'; });
table += '</table>';
s6.innerHTML = table;
</script>
</body>
</html>
