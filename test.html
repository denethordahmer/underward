<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>underward — test</title>
<style>
  body{background:#0b0f14;color:#d7e3ee;font-family:system-ui,sans-serif;padding:20px;font-size:15px;line-height:1.5;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:#7f94a8;font-size:13px;margin-bottom:18px;}
  .section{margin:18px 0;padding:14px 16px;border:1px solid #2a3440;border-radius:12px;background:#121920;}
  .section h2{margin:0 0 10px;font-size:16px;color:#7ee0ff;}
  .pass{color:#7ee08a;font-weight:700;}
  .fail{color:#ff7a7a;font-weight:700;}
  .warn{color:#ffd75e;font-weight:700;}
  code{background:#1a2530;padding:1px 6px;border-radius:5px;font-size:13px;}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px;}
  td,th{border:1px solid #2a3440;padding:6px 9px;text-align:left;vertical-align:top;}
  th{color:#9fb3c5;font-weight:700;}
  .dup{color:#ff7a7a;}
  .missing{color:#ff9a7a;}
  #results{max-width:780px;margin:0 auto;}
</style>
</head>
<body>
<div id="results">
  <h1>underward · test</h1>
  <div class="sub">Loads every script in current index.html order, checks ownership/duplicates, then runs functional checks including a movement/rest regression test. Must be served over http (GitHub Pages), not opened from disk.</div>
  <div id="console"></div>
</div>

<div style="display:none" id="fixtures">
  <canvas id="canvas" width="800" height="600"></canvas>
  <canvas id="minimap" width="170" height="170"></canvas>
  <canvas id="charCanvas" width="200" height="260"></canvas>

  <div id="hud">
    <span id="hudHp"></span><span id="hudAtk"></span><span id="hudTou"></span>
    <span id="hudAgi"></span><span id="hudLuc"></span><span id="hudFloor"></span>
    <span id="hudEnergy"></span><span id="hudGold"></span><span id="hudShards"></span>
    <div id="restDots"></div>
    <button id="minimapBtn"></button><button id="gearBtn"></button><button id="invBtn"></button>
  </div>

  <div id="abilityBar"></div>
  <div id="minimapWrap"></div>
  <div id="combatVignette"></div>

  <div id="logPanel"><button id="logExpandBtn"></button><div id="combatLog"></div></div>
  <div id="logWindow"><div id="logWindowHeader"><button id="logWindowClose"></button></div><div id="logWindowContent"></div></div>

  <div id="floorCard"><div id="floorCardInner"><span id="floorCardNum"></span><span id="floorCardName"></span></div></div>
  <div id="bossIntroOverlay"><div id="bossIntroCard"><span id="bossIntroWarning"></span><span id="bossIntroName"></span><span id="bossIntroTitle"></span><span id="bossIntroFlavour"></span></div></div>

  <div id="stairsPrompt"><div id="stairsCard"><button id="stairsYes"></button><button id="stairsNo"></button></div></div>

  <div id="itemCardOverlay"><div id="itemCard">
    <div id="icHeader"><div><div id="icName"></div><div id="icTier"></div></div><button id="icCloseBtn"></button></div>
    <div id="icFlavour"></div><div id="icStats"></div>
    <div id="icButtons"><button id="icPrimaryBtn"></button><button id="icSecondaryBtn"></button></div>
  </div></div>

  <div id="inventoryScreen"><div class="inv-header"><button id="invCloseBtn2"></button></div>
    <div id="equipRack"></div><div id="invCarriedGrid"></div></div>

  <div id="levelupScreen"><div id="levelupChoices"></div></div>

  <div id="shopScreen"><span id="shopGold"></span><span id="shopGreeting"></span>
    <div id="shopStock"></div><button id="shopHealBtn"></button><button id="shopLeaveBtn"></button></div>

  <div id="hubScreen"><span id="hubShards"></span><div id="hubTabs"></div>
    <div class="shop" id="shop"></div><div id="treePanel"></div><button id="startBtn"></button></div>

  <div id="victoryScreen"><span id="victoryShards"></span><div id="victorySummary"></div>
    <button id="victoryContinue"></button><button id="victoryHub"></button></div>

  <!-- h1 kept: showEndScreen() does deathScreen.querySelector("h1") -->
  <div id="deathScreen"><h1>YOU DIED</h1><div id="deathInfo"></div><div id="deathQuote"></div>
    <div id="deathSummary"></div><span id="deathShards"></span><button id="deathBtn"></button></div>

  <div id="pauseMenu"><div id="pauseCard">
    <button id="muteBtn"></button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.55">
    <button id="pauseRetreatBtn"></button>
    <button id="pauseCloseBtn"></button>
  </div></div>

  <div id="debugPanel">
    <select id="dbgFloor"></select>
    <button id="dbgGo"></button><button id="dbgGold"></button><button id="dbgShards"></button>
    <button id="dbgHeal"></button><button id="dbgLowHp"></button><button id="dbgPoison"></button>
    <button id="dbgBleed"></button><button id="dbgBurn"></button><button id="dbgWeaken"></button>
    <button id="dbgElite"></button><button id="dbgXP"></button><button id="dbgShop"></button>
    <button id="dbgVictory"></button><button id="dbgDeath"></button><button id="dbgRender"></button>
    <button id="dbgDump"></button><button id="dbgReset"></button>
  </div>
</div>

<script>
/* ── stubs for canvas (Android/headless safe) ─────────────────── */
function makeCtx(){
  var gradient = { addColorStop: function(){} };
  return new Proxy(function(){}, {
    get: function(t, p){
      if (p === "createLinearGradient" || p === "createRadialGradient" || p === "createPattern") return function(){ return gradient; };
      if (p === "measureText") return function(){ return { width: 0 }; };
      if (p === "canvas") return {};
      return function(){};
    },
    set: function(t, p, v){ t[p] = v; return true; }
  });
}
var canvases = document.querySelectorAll("canvas");
for (var c = 0; c < canvases.length; c++) canvases[c].getContext = function(){ return makeCtx(); };
window.requestAnimationFrame = function(){};
window.cancelAnimationFrame = function(){};

/* ── output helpers ───────────────────────────────────────────── */
var outBox = document.getElementById("console");
function out(html){ outBox.insertAdjacentHTML("beforeend", html); }
function sec(title){
  var id = "sec" + (sec.n = (sec.n || 0) + 1);
  out('<div class="section"><h2>' + title + '</h2><div id="' + id + '"></div></div>');
  return document.getElementById(id);
}

/* ── load order (mirrors index.html — 24 files) ──────────────── */
var FILES = [
  "js/config.js",
  "js/content/con-monsters.js",
  "js/content/con-items.js",
  "js/content/con-biomes.js",
  "js/content/con-traits.js",
  "js/content/con-progression.js",
  "js/save.js",
  "js/attrs.js",
  "js/items.js",
  "js/sprites.js",
  "js/content/con-bosssprites.js",
  "js/state.js",
  "js/levels.js",
  "js/traits.js",
  "js/combat.js",
  "js/movement.js",
  "js/rewards.js",
  "js/effects.js",
  "js/sfx.js",
  "js/log.js",
  "js/render.js",
  "js/pathfind.js",
  "js/input.js",
  "js/ui.js",
  "js/progression.js",
  "js/main.js"
];

var LEGACY_IDS = ["introOverlay"];

// overlays that must be closed before the uiBlocked test, in case an earlier
// section left one open (e.g. showBossIntro fires on floors 10 and 20)
var ALL_OVERLAYS = ["hubScreen","deathScreen","inventoryScreen","shopScreen","victoryScreen",
  "stairsPrompt","bossIntroOverlay","itemCardOverlay","logWindow","pauseMenu","levelUpScreen"];

var ownership = {};
var dupes = {};
var errors = [];
var parityFailures = 0;
var extraFailures = 0;
var bossSpriteFailures = 0;
var floorFailures = 0;
var movementFailures = 0;
var domFailures = 0;
var missing = [];

/* ── 0. Load every file IN ORDER with per-file diff ───────────── */
var s0 = sec("0. Load order &amp; ownership");
FILES.forEach(function(file){
  var before = Object.keys(window.Delve || {});
  var loaded = false;
  try {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", file + "?v=" + Date.now(), false);
    xhr.send();
    if (xhr.status !== 200 && xhr.status !== 0){
      errors.push(file + " — HTTP " + xhr.status);
      s0.insertAdjacentHTML("beforeend", '<div class="fail">✗ ' + file + ' — HTTP ' + xhr.status + ' (missing at this path?)</div>');
    } else {
      (new Function(xhr.responseText))();
      loaded = true;
    }
  } catch (err){
    errors.push(file + " — " + err.message);
    s0.insertAdjacentHTML("beforeend",
      '<div class="fail">✗ ' + file + ' — <b>' + err.message + '</b></div>');
  }
  if (loaded){
    var after = Object.keys(window.Delve || {});
    var added = [];
    after.forEach(function(k){
      if (before.indexOf(k) < 0){
        added.push(k);
        if (ownership[k]) (dupes[k] = dupes[k] || []).push(file);
        else ownership[k] = file;
      }
    });
    s0.insertAdjacentHTML("beforeend",
      '<div class="pass">✓ ' + file + ' <span style="color:#9fb3c5">(' + added.length + ' new)</span></div>');
  }
});

if (typeof window.Delve.draw === "function") window.Delve.draw = function(){};

/* ── 1. index.html script tag parity (duplicate-aware) ────────── */
var s1 = sec("1. index.html script tag parity");
try {
  var idxText = null;
  try {
    var ix = new XMLHttpRequest();
    ix.open("GET", "index.html?v=" + Date.now(), false);
    ix.send();
    if (ix.status === 200 || ix.status === 0) idxText = ix.responseText;
  } catch(eIdx){ idxText = null; }

  if (!idxText){
    s1.innerHTML = '<div class="warn">Could not read index.html (serve over http). Parity not verified.</div>';
  } else {
    // strip HTML comments so a commented-out script tag cannot count
    var stripped = idxText.replace(/<!--[\s\S]*?-->/g, "");
    var raw = stripped.match(/js\/[A-Za-z0-9_\-.\/]+\.js/g) || [];

    var seen = {}, live = [], repeated = [];
    raw.forEach(function(f){
      if (seen[f]) repeated.push(f);
      else { seen[f] = 1; live.push(f); }
    });

    var mismatch = (live.length !== FILES.length);
    if (!mismatch){
      for (var fi = 0; fi < live.length; fi++){
        if (live[fi] !== FILES[fi]){ mismatch = true; break; }
      }
    }

    var head = '<div style="color:#9fb3c5;font-size:13px;margin-bottom:6px">' +
      'references found: ' + raw.length + ' · unique: ' + live.length +
      ' · expected: ' + FILES.length + '</div>';

    if (repeated.length){
      var uniqRep = [];
      repeated.forEach(function(r){ if (uniqRep.indexOf(r) < 0) uniqRep.push(r); });
      head += '<div class="fail">✗ Duplicated in index.html: ' + uniqRep.join(", ") +
        ' — each script must appear exactly once.</div>';
    }

    if (!mismatch && !repeated.length){
      s1.innerHTML = head + '<div class="pass">✓ index.html loads exactly these ' + live.length +
        ' scripts, in this order — FILES[] matches live.</div>';
    } else {
      parityFailures = 1;
      s1.innerHTML = head + '<div class="fail">FILES[] has drifted from index.html.</div>' +
        '<table><tr><th>#</th><th>test.html FILES[]</th><th>index.html (first occurrence)</th></tr>';
      var maxN = Math.max(live.length, FILES.length);
      for (var n = 0; n < maxN; n++){
        var a = FILES[n] || "—", b = live[n] || "—";
        var cls = (a === b) ? "" : ' class="dup"';
        s1.innerHTML += '<tr' + cls + '><td>' + n + '</td><td>' + a + '</td><td>' + b + '</td></tr>';
      }
      s1.innerHTML += '</table>';
    }
  }
} catch (err){
  parityFailures = 1;
  s1.innerHTML = '<div class="fail">Parity check aborted: ' + err.message + '</div>';
}

/* ── 2. Duplicate definitions ────────────────────────────────── */
var s2 = sec("2. Duplicate definitions");
var dupKeys = Object.keys(dupes);
if (!dupKeys.length) s2.innerHTML = '<div class="pass">✓ No duplicates — single ownership holds.</div>';
else {
  s2.innerHTML = '<div class="warn">Re-defined (last file wins):</div><table><tr><th>Key</th><th>First defined in</th><th>Re-defined by</th></tr>';
  dupKeys.forEach(function(k){
    s2.innerHTML += '<tr><td class="dup">' + k + '</td><td>' + ownership[k] + '</td><td>' + dupes[k].join(", ") + '</td></tr>';
  });
  s2.innerHTML += '</table>';
}

/* ── 3. Required functions AND required objects ──────────────── */
var s3 = sec("3. Required functions &amp; objects");
var REQUIRED_FN = [
  "newRun","genFloor","openChest","maxHp","atk","dmgRed","dodge","crit",
  "luckPts","agiPts","touPts","strPts","baseAtk","baseLuck",
  "equipItem","unequipItem","useConsumable","itemStatLines","itemBuffs",
  "makeItem","rollTier","pickupItem","playerSpeed","wardOf",
  "killRewards","floorClearBonus","makeElite","startCombat","endCombat",
  "tryAct","tryActOnStep","smashBarrel",
  "triggerVictory","tryRest","descend","die","retreat","convertGold",
  "applyBossBonus","recordStat","addFloater","updateHUD","renderMinimap",
  "refreshHub","openInventory","openShop","buildShop",
  "applyEffect","applyPlayerEffect","tickPlayerEffects","statusColor",
  "registerBossSprite","rebuildSprites","castAbility","addXP","addAbility",
  "logXP","logKill","logSystem","logFloor","hasProgression","markRunTrait",
  "injectHubAbilities","persist","isShopFloor","getWard","getMonsterBand",
  "findPath","stepPath","uiBlocked"
];
// Non-function globals. `save` lives here, NOT in REQUIRED_FN — Delve.save is
// the DATA object, so a typeof==="function" check could never pass.
var REQUIRED_OBJ = [
  "CONFIG","save","T","TIERS","SLOT_DEFS","itemDefs","potionDefs","SPR","_hooks"
];

var missingFn = REQUIRED_FN.filter(function(k){ return typeof window.Delve[k] !== "function"; });
var missingObj = REQUIRED_OBJ.filter(function(k){ return !window.Delve[k]; });
missing = missingFn.concat(missingObj);

if (!missing.length){
  s3.innerHTML = '<div class="pass">✓ All ' + REQUIRED_FN.length + ' required functions and ' +
    REQUIRED_OBJ.length + ' required objects present.</div>';
} else {
  s3.innerHTML = '';
  if (missingFn.length)  s3.innerHTML += '<div class="fail">Missing functions:</div><div class="missing">' + missingFn.join(", ") + '</div>';
  if (missingObj.length) s3.innerHTML += '<div class="fail">Missing objects:</div><div class="missing">' + missingObj.join(", ") + '</div>';
}

/* ── 4. Content registries (all con- files) ───────────────────── */
var s4 = sec("4. Content registries");
try {
  var cfg = window.Delve.CONFIG, d = window.Delve;
  var needCfg = ["MONSTER_ROSTER","MONSTER_BANDS","BOSS_DEFS","elite","xpKill",
                 "WARDS","BIOMES","TRAITS","PROGRESSION","loot","STATUS_EFFECTS",
                 "statusChance","SLOTS","SLOT_ORDER","ATTRS","WEIGHT","WEAPON_SPEEDS"];
  var needDelve = ["TIERS","SLOT_DEFS","itemDefs","potionDefs"];
  var absentCfg = needCfg.filter(function(k){ return !cfg[k]; });
  var absentDelve = needDelve.filter(function(k){ return !d[k]; });
  var rosterCount = Object.keys(cfg.MONSTER_ROSTER || {}).length;
  var itemCount = Object.keys(d.itemDefs || {}).length;
  var trees = (cfg.PROGRESSION && cfg.PROGRESSION.TREES || []).length;
  var nodeTrees = Object.keys((cfg.PROGRESSION && cfg.PROGRESSION.NODES) || {}).length;
  var abilities = (cfg.TRAITS && cfg.TRAITS.abilities) || [];
  var noData = abilities.filter(function(a){ return !a.data; }).map(function(a){ return a.id; });

  var badWeights = [];
  (cfg.MONSTER_BANDS || []).forEach(function(b, bi){
    Object.keys(b.weights || {}).forEach(function(k){
      if (!cfg.MONSTER_ROSTER[k]) badWeights.push("band " + bi + " → " + k);
    });
  });

  if (!absentCfg.length && !absentDelve.length && !noData.length && !badWeights.length){
    s4.innerHTML = '<div class="pass">✓ All registries loaded — monsters: ' + rosterCount +
      ', items: ' + itemCount + ', trees: ' + trees + ', node trees: ' + nodeTrees +
      ', abilities with data: ' + abilities.length + '/' + abilities.length + '</div>';
  } else {
    extraFailures += absentCfg.length + absentDelve.length + noData.length + badWeights.length;
    s4.innerHTML = '<div class="fail">Content problems:</div>';
    if (absentCfg.length)   s4.innerHTML += '<div class="missing">CONFIG missing: ' + absentCfg.join(", ") + '</div>';
    if (absentDelve.length) s4.innerHTML += '<div class="missing">Delve missing: ' + absentDelve.join(", ") + '</div>';
    if (noData.length)      s4.innerHTML += '<div class="missing">Abilities without data{}: ' + noData.join(", ") + '</div>';
    if (badWeights.length)  s4.innerHTML += '<div class="missing">Band weights with no roster row: ' + badWeights.join(", ") + '</div>';
  }
} catch (err){
  extraFailures++;
  s4.innerHTML = '<div class="fail">Content check aborted: ' + err.message + '</div>';
}

/* ── 5. Boss data + sprite registry ──────────────────────────── */
var s5 = sec("5. Boss data &amp; sprite registry");
try {
  var registered = window.Delve._bossSpriteBuilders || {};
  var bossDefs = (window.Delve.CONFIG && window.Delve.CONFIG.BOSS_DEFS) || {};
  var problems = [], expectedKeys = [];
  for (var bk in bossDefs){
    var bd = bossDefs[bk];
    if (bd.sprite) expectedKeys.push(bd.sprite);
    else problems.push((bd.name || ("BOSS_DEFS[" + bk + "]")) + " — missing .sprite");
    if (!bd.accent) problems.push((bd.name || ("BOSS_DEFS[" + bk + "]")) + " — missing .accent");
  }
  var missingBuilders = expectedKeys.filter(function(k){ return typeof registered[k] !== "function"; });
  var missingSprites = expectedKeys.filter(function(k){ return !(window.Delve.SPR && window.Delve.SPR[k] && window.Delve.SPR[k].idle); });
  if (!problems.length && !missingBuilders.length && !missingSprites.length){
    s5.innerHTML = '<div class="pass">✓ ' + expectedKeys.length + ' boss(es) — sprite + accent set, registered, built: ' + expectedKeys.join(", ") + '</div>';
  } else {
    bossSpriteFailures = problems.length + missingBuilders.length + missingSprites.length;
    s5.innerHTML = '<div class="fail">Boss problems:</div><div class="missing">';
    if (problems.length)        s5.innerHTML += problems.join("<br>") + "<br>";
    if (missingBuilders.length) s5.innerHTML += "No builder registered: " + missingBuilders.join(", ") + "<br>";
    if (missingSprites.length)  s5.innerHTML += "No sprite built: " + missingSprites.join(", ");
    s5.innerHTML += '</div>';
  }
} catch (err){
  bossSpriteFailures = 1;
  s5.innerHTML = '<div class="fail">Boss check aborted: ' + err.message + '</div>';
}

/* ── 6. Save schema + persistence round-trip ──────────────────── */
var s6 = sec("6. Save schema &amp; persistence");
try {
  var s = window.Delve.save;
  var need = ["version","shards","bestFloor","lvls","unlocks","nodes","inventoryCap",
              "abilities","abilityRanks","runTraits","runTraitsSeen","seenTutorial"];
  var absent = need.filter(function(k){ return !(k in s); });
  s.nodes = s.nodes || {};
  s.nodes.__probe = 1;
  window.Delve.persist();
  var reread = JSON.parse(localStorage.getItem("underward_save_v3") || "null");
  var persisted = !!(reread && reread.nodes && reread.nodes.__probe);
  delete s.nodes.__probe;
  window.Delve.persist();
  if (!absent.length && persisted){
    s6.innerHTML = '<div class="pass">✓ Save schema complete; purchases survive persist() round-trip.</div>';
  } else {
    extraFailures += absent.length + (persisted ? 0 : 1);
    s6.innerHTML = '<div class="fail">Save problems:</div>';
    if (absent.length)    s6.innerHTML += '<div class="missing">Missing fields: ' + absent.join(", ") + '</div>';
    if (!persisted)       s6.innerHTML += '<div class="missing">Node purchases do NOT survive persist() — whitelist still dropping them.</div>';
  }
} catch (err){
  extraFailures++;
  s6.innerHTML = '<div class="fail">Save check aborted: ' + err.message + '</div>';
}

/* ── 7. Floor generation (50 trials, floors 1–20) ─────────────── */
var s7 = sec("7. Floor generation (50 trials, floors 1-20)");
try {
  if (typeof window.Delve.newRun !== "function") throw new Error("newRun missing");
  window.Delve.newRun();
  var G = window.Delve.G;
  if (!G) throw new Error("Delve.G still null after newRun");

  var trials = 50, fails = [];
  for (var t = 0; t < trials; t++){
    G.floor = (t % 20) + 1;
    var ward = window.Delve.getWard(G.floor);
    if (!ward){ fails.push("trial " + t + ": no ward for floor " + G.floor); continue; }
    var biomeIdx = (ward.biome !== undefined) ? ward.biome : -1;
    if (biomeIdx < 0 || !(window.Delve.CONFIG.BIOMES && window.Delve.CONFIG.BIOMES[biomeIdx]))
      fails.push("trial " + t + ": biome " + biomeIdx + " missing for floor " + G.floor);
    window.Delve.genFloor();
    var w = G.grid[0].length, h = G.grid.length;
    if (G.px < 0 || G.py < 0 || G.px >= w || G.py >= h) fails.push("trial " + t + ": player outside map");
    else if (G.grid[G.py][G.px] !== window.Delve.T.FLOOR) fails.push("trial " + t + ": player not on floor tile");
    if (G.floor % 10 !== 0 && !G.stairs) fails.push("trial " + t + ": no stairs on floor " + G.floor);
    (G.monsters || []).forEach(function(m){
      if (window.Delve.mdist(m.x, m.y, G.px, G.py) <= 1) fails.push("trial " + t + ": monster adjacent to spawn");
    });
    if (G.floor % 10 === 0){
      if (!G.boss) fails.push("trial " + t + ": boss floor " + G.floor + " has no boss");
      else {
        if (G.boss.kind !== (window.Delve.CONFIG.BOSS_DEFS[Math.ceil(G.floor/10)] || {}).sprite)
          fails.push("trial " + t + ": boss kind '" + G.boss.kind + "' ≠ BOSS_DEFS.sprite");
        (G.monsters || []).forEach(function(m){
          if (window.Delve.mdist(m.x, m.y, G.boss.x, G.boss.y) <= 1)
            fails.push("trial " + t + ": guard inside boss arena");
        });
      }
    }
    if (fails.length > 25) break;
  }
  floorFailures = fails.length;
  if (!fails.length) s7.innerHTML = '<div class="pass">✓ ' + trials + ' floors generated cleanly across both wards (incl. boss arena exclusion).</div>';
  else {
    s7.innerHTML = '<div class="fail">' + fails.length + ' problem(s):</div><ul style="margin-left:18px">';
    fails.slice(0, 25).forEach(function(f){ s7.innerHTML += "<li>" + f + "</li>"; });
    s7.innerHTML += "</ul>";
  }
} catch (err){
  floorFailures = 1;
  s7.innerHTML = '<div class="fail">Floor checks aborted: ' + err.message + '</div>';
}

/* ── 8. Movement, rest &amp; pathfinding (regression test) ────── */
var s8 = sec("8. Movement, rest &amp; pathfinding");
try {
  var G8 = window.Delve.G;
  if (!G8) throw new Error("no run — section 7 did not produce G");

  // Neutralise anything an earlier section left on screen. Section 7 generates
  // floors 10 and 20, which call showBossIntro() and leave the overlay up for
  // 3s — that would make uiBlocked() correctly report true later on.
  clearTimeout(window.Delve._bossIntroT);
  clearTimeout(window.Delve._floorCardT);
  ALL_OVERLAYS.forEach(function(id){
    var el = document.getElementById(id);
    if (el) el.style.display = "none";
  });

  var notes = [];
  var mfails = [];

  G8.floor = 1;
  window.Delve.genFloor();

  G8.monsters.forEach(function(m){
    if (G8.grid[m.y] && G8.grid[m.y][m.x] === window.Delve.T.MONSTER) G8.grid[m.y][m.x] = window.Delve.T.FLOOR;
  });
  G8.monsters = [];
  G8.boss = null;
  G8.hp = window.Delve.maxHp();

  // --- 8a: adjacent step via tryAct ---------------------------------
  var dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  var stepped = false, blockedAll = true;
  for (var di = 0; di < dirs.length && !stepped; di++){
    var nx = G8.px + dirs[di][0], ny = G8.py + dirs[di][1];
    if (!G8.grid[ny] || G8.grid[ny][nx] === undefined) continue;
    var cell = G8.grid[ny][nx];
    if (cell !== window.Delve.T.FLOOR) continue;
    blockedAll = false;
    var ox = G8.px, oy = G8.py;
    var beforeHp = G8.hp;
    window.Delve.tryAct(nx, ny);
    if (G8.px === nx && G8.py === ny){
      stepped = true;
    } else {
      G8.px = ox; G8.py = oy; G8.hp = beforeHp;
      mfails.push("tryAct refused an adjacent FLOOR tile at " + nx + "," + ny);
    }
  }
  if (blockedAll) notes.push("no adjacent FLOOR tile to step onto (rare map) — step test skipped");
  else if (stepped) notes.push("tryAct moved the player one tile");

  // --- 8b: rest on own tile ----------------------------------------
  G8.restCount = 0;
  G8.hp = 1;
  window.Delve.tryRest();
  if (G8.restCount === 1 && G8.hp > 1) notes.push("tryRest healed and consumed a rest dot");
  else mfails.push("tryRest did not rest (restCount=" + G8.restCount + ", hp=" + G8.hp + ")");

  // --- 8c: pathfind to a distant tile ------------------------------
  var target = null;
  for (var py = 0; py < G8.grid.length && !target; py++){
    for (var px = 0; px < G8.grid[0].length; px++){
      if (G8.grid[py][px] !== window.Delve.T.FLOOR) continue;
      if (window.Delve.mdist(px, py, G8.px, G8.py) >= 6){ target = { x:px, y:py }; break; }
    }
  }
  if (!target){
    notes.push("no distant FLOOR tile to path to — path test skipped");
  } else {
    var path = window.Delve.findPath(target.x, target.y);
    if (!path || !path.length){
      mfails.push("findPath returned no route to a reachable FLOOR tile at " + target.x + "," + target.y);
    } else {
      notes.push("findPath found a route of " + path.length + " step(s)");
      G8._path = path;
      var px0 = G8.px, py0 = G8.py;
      window.Delve.stepPath();
      if (G8.px !== px0 || G8.py !== py0) notes.push("stepPath advanced along the route");
      else mfails.push("stepPath did not advance the player");
    }
  }

  // --- 8d: uiBlocked toggling (all overlays now closed) ------------
  var hub = document.getElementById("hubScreen");
  hub.style.display = "flex";
  var blockedWhenShown = window.Delve.uiBlocked();
  hub.style.display = "none";
  var blockedWhenHidden = window.Delve.uiBlocked();
  if (blockedWhenShown && !blockedWhenHidden) notes.push("uiBlocked correctly gates on visible overlays");
  else mfails.push("uiBlocked wrong (shown=" + blockedWhenShown + ", hidden=" + blockedWhenHidden +
    " — blockers: " + ((window.Delve._lastBlockers || []).join("+") || "none") + ")");

  movementFailures = mfails.length;
  if (!mfails.length){
    s8.innerHTML = '<div class="pass">✓ Tap chain intact.</div><ul style="margin-left:18px">' +
      notes.map(function(n){ return "<li>" + n + "</li>"; }).join("") + '</ul>';
  } else {
    s8.innerHTML = '<div class="fail">' + mfails.length + ' movement problem(s):</div><ul style="margin-left:18px">' +
      mfails.map(function(f){ return "<li>" + f + "</li>"; }).join("") + '</ul>';
    if (notes.length){
      s8.innerHTML += '<div style="color:#9fb3c5;font-size:13px;margin-top:6px">Passed:</div><ul style="margin-left:18px;color:#9fb3c5">' +
        notes.map(function(n){ return "<li>" + n + "</li>"; }).join("") + '</ul>';
    }
  }
} catch (err){
  movementFailures = 1;
  s8.innerHTML = '<div class="fail">Movement test aborted: ' + err.message + '</div>';
}

/* ── 9. Missing DOM elements ──────────────────────────────────── */
var s9 = sec("9. DOM integrity (missingEls)");
try {
  if (window.Delve.showHub) window.Delve.showHub();

  var misses = (window.Delve.missingEls || []).slice();
  var legacy = misses.filter(function(id){ return LEGACY_IDS.indexOf(id) >= 0; });
  var real = misses.filter(function(id){ return LEGACY_IDS.indexOf(id) < 0; });
  domFailures = real.length;

  var html = "";
  if (!real.length){
    html += '<div class="pass">✓ No unexpected missing elements — every id ui.js asks for exists.</div>';
  } else {
    html += '<div class="fail">ui.js asked for ids that do not exist (guarded, but should be fixed): ' +
      real.join(", ") + '</div>';
  }
  if (legacy.length){
    html += '<div class="warn">Legacy references (dead wiring from the deleted onboarding file, harmless): ' +
      legacy.join(", ") + '</div>';
  }
  if (!misses.length){
    html += '<div style="color:#7f94a8;font-size:13px;margin-top:6px">Delve.missingEls is empty.</div>';
  }
  s9.innerHTML = html;
} catch (err){
  domFailures = 1;
  s9.innerHTML = '<div class="fail">DOM check aborted: ' + err.message + '</div>';
}

/* ── 10. Tier rolls ───────────────────────────────────────────── */
var s10 = sec("10. Tier rolls");
try {
  var counts = {1:0, 2:0, 3:0, 4:0};
  var bad = 0;
  var N = 400;
  for (var i = 0; i < N; i++){
    var tier = window.Delve.rollTier(15);
    // counts[tier] is 0 initially, so `!counts[tier]` is ALWAYS true — must use
    // an explicit membership test instead. (This check was wrong before.)
    if (!(tier in counts)) { bad++; continue; }
    counts[tier]++;
  }
  var sum = counts[1] + counts[2] + counts[3] + counts[4];
  var outcomesOk = (bad === 0 && sum === N && counts[4] === 0 &&
                    counts[1] > 0 && counts[2] > 0 && counts[3] > 0);
  if (outcomesOk){
    s10.innerHTML = '<div class="pass">✓ ' + N + ' tier rolls on floor 15 (ward 2) all returned 1-3: ' +
      "T1:" + counts[1] + " T2:" + counts[2] + " T3:" + counts[3] + " T4:" + counts[4] +
      ' <span style="color:#9fb3c5">(T4 = 0 by design until ward 3)</span></div>';
  } else {
    extraFailures++;
    s10.innerHTML = '<div class="fail">Tier roll problems — out-of-range: ' + bad +
      ', total counted: ' + sum + '/' + N + ', T4: ' + counts[4] + '</div>';
  }
} catch (err){
  extraFailures++;
  s10.innerHTML = '<div class="fail">Tier roll check aborted: ' + err.message + '</div>';
}

/* ── 11. Summary ──────────────────────────────────────────────── */
var s11 = sec("11. Summary");
var total = errors.length + missing.length + dupKeys.length + bossSpriteFailures +
            floorFailures + extraFailures + parityFailures + movementFailures + domFailures;
if (!total){
  s11.innerHTML = '<div class="pass">✓ ALL GREEN — load order matches index.html, no duplicates, ' +
    'tap chain intact, save round-trips, floors generate, tier rolls healthy.</div>';
} else {
  s11.innerHTML = '';
  if (errors.length)         s11.innerHTML += '<div class="fail">Script errors: ' + errors.length + '</div>';
  if (parityFailures)        s11.innerHTML += '<div class="fail">index.html parity: FAILED</div>';
  if (missing.length)        s11.innerHTML += '<div class="fail">Missing globals: ' + missing.length + '</div>';
  if (dupKeys.length)        s11.innerHTML += '<div class="warn">Duplicates: ' + dupKeys.length + '</div>';
  if (bossSpriteFailures)    s11.innerHTML += '<div class="fail">Boss sprite issues: ' + bossSpriteFailures + '</div>';
  if (floorFailures)         s11.innerHTML += '<div class="fail">Floor generation issues: ' + floorFailures + '</div>';
  if (movementFailures)      s11.innerHTML += '<div class="fail">Movement/tap chain issues: ' + movementFailures + '</div>';
  if (domFailures)           s11.innerHTML += '<div class="fail">Missing DOM elements: ' + domFailures + '</div>';
  if (extraFailures)         s11.innerHTML += '<div class="fail">Other issues: ' + extraFailures + '</div>';
}

/* ── 12. Ownership registry ───────────────────────────────────── */
var s12 = sec("12. Ownership registry");
var keys = Object.keys(ownership).sort();
var table = '<table><tr><th>Key</th><th>First defined by</th></tr>';
keys.forEach(function(k){ table += '<tr><td><code>' + k + '</code></td><td>' + ownership[k] + '</td></tr>'; });
table += '</table>';
s12.innerHTML = table;
</script>
</body>
</html>
